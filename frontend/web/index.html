<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EnactSpace, plateforme interne Enactus ESP.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EnactSpace">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>

  <title>EnactSpace</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="enactspace-startup" role="status" aria-label="Chargement d’EnactSpace"
       style="position:fixed;inset:0;display:grid;place-items:center;background:#fff;pointer-events:none">
    <div style="text-align:center;padding:28px;font-family:Arial,sans-serif;color:#222">
      <div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:20px">
        <img src="assets/assets/brand/logo/enactspace_logo_full_transparent.png"
             alt="EnactSpace" width="210" height="160" style="object-fit:contain">
        <img src="assets/assets/img/logo_enactus_esp.png"
             alt="Enactus ESP" width="160" height="160" style="object-fit:contain">
      </div>
      <p style="font-weight:700">Gestion interne Enactus ESP</p>
      <p>Chargement…</p>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('enactspace-startup')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="enactmeet_bridge.js"></script>
  <script src="chat_voice_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
