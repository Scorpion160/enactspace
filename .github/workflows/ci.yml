name: Application CI

on:
  pull_request:
    branches:
      - main
      - feat/product-readiness-v1
      - feat/institutional-documents-v1
      - feat/institutional-pdf-generation-v1
  push:
    branches:
      - main
      - feat/product-readiness-v1
      - feat/institutional-documents-v1
      - feat/institutional-pdf-generation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.12 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: sqlite://
      TEST_DATABASE_URL: postgresql+psycopg://pr2b_test:ci-only-disposable-password@127.0.0.1:5432/enactspace_pr2b_test_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enactspace_pr2b_test_ci
          POSTGRES_USER: pr2b_test
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr2b_test -d enactspace_pr2b_test_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install LaTeX renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-lang-french texlive-fonts-recommended
          pdflatex --version | head -n 1

      - name: Generate an ephemeral application secret
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SECRET_KEY={secrets.token_hex(48)}\n")
          PY

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify isolated PostgreSQL 16 service
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["TEST_DATABASE_URL"])
          assert url.database == "enactspace_pr2b_test_ci"
          assert url.host in {"127.0.0.1", "localhost"}
          engine = create_engine(url)
          with engine.connect() as connection:
              version = connection.execute(text("SHOW server_version_num")).scalar_one()
          assert str(version).startswith("16"), version
          engine.dispose()
          PY

      - name: Compile backend
        run: python -m compileall -q app

      - name: Generate OpenAPI schema
        run: >-
          python -c "from app.main import app; schema = app.openapi();
          assert schema.get('openapi'); assert schema.get('info', {}).get('title')"

      - name: Verify the single Alembic head
        shell: bash
        run: |
          output="$(python -m alembic heads)"
          printf '%s\n' "$output"
          test "$output" = "20260913_0009 (head)"

      - name: Run complete backend suite with PostgreSQL and PDF tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee "$RUNNER_TEMP/backend-tests.log"
          if grep -Eq 'TEST_DATABASE_URL missing: real PostgreSQL tests NOT RUN' "$RUNNER_TEMP/backend-tests.log"; then
            echo "PostgreSQL-dependent tests were skipped." >&2
            exit 1
          fi

  flutter:
    name: Flutter 3.44.9 / analyze, test, web, Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze Flutter sources
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build release web application
        run: >-
          flutter build web --release --no-pub
          --dart-define=ENACTSPACE_API_URL=https://example.invalid

      - name: Build unsigned Android debug APK
        run: flutter build apk --debug --no-pub
