name: Application CI

on:
  pull_request:
    branches:
      - main
      - feature/interface-coherence-20261107
      - feature/recruitment-decision-workspace-20261110
      - integration/recruitment-production-parity-20261110
      - integration/enactspace-web-v3-20261107
      - feat/product-readiness-v1
      - feat/institutional-documents-v1
      - feat/institutional-pdf-generation-v1
  push:
    branches:
      - main
      - feature/recruitment-decision-workspace-20261110
      - integration/recruitment-production-parity-20261110
      - fix/chat-scroll-and-payment-hardening-20261111
      - feat/product-readiness-v1
      - feat/institutional-documents-v1
      - feat/institutional-pdf-generation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.12 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: sqlite://
      TEST_DATABASE_URL: postgresql+psycopg://pr2b_test:ci-only-disposable-password@127.0.0.1:5432/enactspace_pr2b_test_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enactspace_pr2b_test_ci
          POSTGRES_USER: pr2b_test
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr2b_test -d enactspace_pr2b_test_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install LaTeX renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-lang-french texlive-fonts-recommended
          pdflatex --version | head -n 1

      - name: Generate an ephemeral application secret
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SECRET_KEY={secrets.token_hex(48)}\n")
          PY

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify isolated PostgreSQL 16 service
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["TEST_DATABASE_URL"])
          assert url.database == "enactspace_pr2b_test_ci"
          assert url.host in {"127.0.0.1", "localhost"}
          engine = create_engine(url)
          with engine.connect() as connection:
              version = connection.execute(text("SHOW server_version_num")).scalar_one()
          assert str(version).startswith("16"), version
          engine.dispose()
          PY

      - name: Compile backend
        run: python -m compileall -q app

      - name: Prepare synthetic test-only backend resources
        env:
          APP_ENV: test
        run: python ops_checks/prepare_ci_resources.py

      - name: Generate OpenAPI schema
        run: >-
          python -c "from app.main import app; schema = app.openapi();
          assert schema.get('openapi'); assert schema.get('info', {}).get('title')"

      - name: Verify the single Alembic head
        shell: bash
        run: |
          output="$(python -m alembic heads)"
          printf '%s\n' "$output"
          test "$output" = "20261107_0038 (head)"

      - name: Run complete backend suite with PostgreSQL and PDF tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee "$RUNNER_TEMP/backend-tests.log"
          if grep -Eq 'TEST_DATABASE_URL missing: real PostgreSQL tests NOT RUN' "$RUNNER_TEMP/backend-tests.log"; then
            echo "PostgreSQL-dependent tests were skipped." >&2
            exit 1
          fi
          python -m unittest discover -s tests -v

      - name: Smoke-test production-mode Uvicorn startup on disposable CI database
        run: python ops_checks/smoke_production_entrypoint.py

  flutter:
    name: Flutter 3.47.5 / analyze, test, web only
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Verify EnactMeet browser attachment and cleanup
        working-directory: ${{ github.workspace }}
        run: python3 tools/test_enactmeet_web_bridge.py --browser google-chrome

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Check candidate release metadata consistency
        working-directory: ${{ github.workspace }}
        run: python3 tools/check_web_release_metadata.py

      - name: Analyze Flutter sources
        run: flutter analyze --no-pub

      - name: Prepare synthetic test-only backend resources
        env:
          APP_ENV: test
        run: python ../backend/ops_checks/prepare_ci_resources.py

      - name: Run Web recruitment and member tests
        run: >-
          flutter test --no-pub
          test/recruitment_statistics_screen_test.dart
          test/chat_message_viewport_test.dart
          test/chat_composer_drafts_test.dart
          test/mobile_money_readiness_card_test.dart
          test/features/recruitment/recruitment_advisory_filters_test.dart
          test/features/recruitment/recruitment_comparison_panel_test.dart
          test/enactmeet_quick_create_test.dart
          test/archives_hall_of_fame_test.dart
          test/archives_responsive_test.dart
          test/alumni_gamification_academy_impact_test.dart
          test/recruitment_public_test.dart
          test/recruitment_submission_contract_test.dart
          test/recruitment_eligibility_selection_test.dart
          test/recruitment_schedule_test.dart
          test/recruitment_team_guide_test.dart
          test/alumni_individual_workflows_test.dart
          test/meetings_creation_test.dart
          test/recruitment_internal_test.dart
          test/recruitment_jury_personality_test.dart
          test/recruitment_campaigns_test.dart
          test/member_join_requests_test.dart
          test/ui_final_acceptance_test.dart

      - name: Load Material icon font for readable visual review
        shell: bash
        run: |
          flutter_bin="$(readlink -f "$(command -v flutter)")"
          sdk_root="$(dirname "$(dirname "$flutter_bin")")"
          icon_path="$sdk_root/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          test -f "$icon_path"
          echo "ENACTSPACE_QA_ICON_FONT=$icon_path" >> "$GITHUB_ENV"

      - name: Capture synthetic recruitment visual acceptance views
        run: >-
          flutter test --no-pub
          test/recruitment_visual_review_test.dart
          test/recruitment_selection_visual_test.dart

      - name: Archive synthetic desktop and phone screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recruitment-visual-review-${{ github.run_id }}
          path: frontend/build/recruitment-visual-review/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Build candidate Web against production API URL (no deployment)
        run: >-
          flutter build web --release --no-pub --no-tree-shake-icons
          --dart-define=ENACTSPACE_API_URL=https://api-enactspace.kerunjombor.net

      - name: Inspect Web candidate and write integrity manifest
        working-directory: ${{ github.workspace }}
        run: python3 tools/check_web_release_metadata.py --built

      - name: Recheck live fingerprints and recover exact public Firebase worker
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fingerprint_public_production.py production-fingerprint
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('production-fingerprint/public_fingerprint.json').read_text())
          checks = report['results']
          assert report['all_public_checks_ok']
          assert checks['web_version']['public_fields']['version'] == '1.0.30'
          assert str(checks['web_version']['public_fields']['build_number']) == '35'
          assert checks['web_main']['sha256'] == '0edccbd6542c23c042a29164bcb64d22082ccc96b015269c9002beeb34fbec8e'
          assert checks['web_firebase_worker']['sha256'] == '5560e639af87e9c35428ac7ef0f6dccf0c1b8299ff359af82302ba491a50b2c3'
          assert checks['api_health']['public_fields']['ok'] is True
          print('LIVE_RELEASE_FINGERPRINTS_PINNED')
          PY
          cp production-fingerprint/firebase-messaging-sw.js frontend/build/web/firebase-messaging-sw.js

      - name: Assemble and self-check immutable Web candidate (no deployment)
        working-directory: ${{ github.workspace }}
        run: >-
          python3 tools/assemble_web_release.py
          --worker-sha256 5560e639af87e9c35428ac7ef0f6dccf0c1b8299ff359af82302ba491a50b2c3
          --live-main-sha256 0edccbd6542c23c042a29164bcb64d22082ccc96b015269c9002beeb34fbec8e
          --live-version 1.0.30
          --live-build 35

      - name: Archive preflight-validated Web candidate (not deployed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enactspace-web-1.0.30-build37-PREFLIGHT-ONLY-${{ github.run_id }}
          path: frontend/build/release-candidate/*
          if-no-files-found: error
          retention-days: 7
