name: Application CI

on:
  pull_request:
    branches:
      - main
      - recovery/final-20260927
      - feat/product-readiness-v1
      - feat/institutional-documents-v1
      - feat/institutional-pdf-generation-v1
      - feature/recruitment-ui-20261101
      - feature/alumni-refonte-20261104
      - feature/archives-refonte-20261104
  push:
    branches:
      - main
      - recovery/final-20260927
      - feat/product-readiness-v1
      - feat/institutional-documents-v1
      - feat/institutional-pdf-generation-v1
      - feature/recruitment-ui-20261101
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.12 / PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      EMAIL_ENABLED: "false"
      PUSH_ENABLED: "false"
      DATABASE_URL: sqlite://
      TEST_DATABASE_URL: postgresql+psycopg://pr2b_test:ci-only-disposable-password@127.0.0.1:5432/enactspace_pr2b_test_ci
      ACADEMY_TEST_POSTGRESQL_URL: postgresql+psycopg://pr2b_test:ci-only-disposable-password@127.0.0.1:5432/enactspace_academy_pg_test_ci
      VEILLE_TEST_POSTGRESQL_URL: postgresql+psycopg://pr2b_test:ci-only-disposable-password@127.0.0.1:5432/enactspace_pr2b_test_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enactspace_pr2b_test_ci
          POSTGRES_USER: pr2b_test
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pr2b_test -d enactspace_pr2b_test_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install LaTeX renderer
        timeout-minutes: 15
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path

          # Avoid the regional mirror that stalled the renderer download.
          paths = [Path('/etc/apt/sources.list')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          paths += list(Path('/etc/apt').glob('*mirror*.txt'))
          for path in paths:
              if path.is_file():
                  source = path.read_text()
                  updated = source.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  updated = updated.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != source:
                      path.write_text(updated)
          PY
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::https::Timeout=30 install -y --no-install-recommends texlive-latex-extra texlive-lang-french texlive-fonts-recommended gnupg
          pdflatex --version | head -n 1

      - name: Generate an ephemeral application secret
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SECRET_KEY={secrets.token_hex(48)}\n")
          PY

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify isolated PostgreSQL 16 service
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["TEST_DATABASE_URL"])
          assert url.database == "enactspace_pr2b_test_ci"
          assert url.host in {"127.0.0.1", "localhost"}
          engine = create_engine(url)
          with engine.connect() as connection:
              version = connection.execute(text("SHOW server_version_num")).scalar_one()
          assert str(version).startswith("16"), version
          engine.dispose()
          academy_url = make_url(os.environ["ACADEMY_TEST_POSTGRESQL_URL"])
          assert academy_url == url.set(database="enactspace_academy_pg_test_ci")
          with create_engine(url, isolation_level="AUTOCOMMIT").connect() as connection:
              connection.exec_driver_sql("CREATE DATABASE enactspace_academy_pg_test_ci")
          PY

      - name: Compile backend
        run: python -m compileall -q app

      - name: Generate OpenAPI schema
        run: >-
          python -c "from app.main import app; schema = app.openapi();
          assert schema.get('openapi'); assert schema.get('info', {}).get('title')"

      - name: Verify the single Alembic head
        shell: bash
        run: |
          output="$(python -m alembic heads)"
          printf '%s\n' "$output"
          test "$output" = "20261106_0037 (head)"

      - name: Verify host-only backup encryption integrity
        run: python -m unittest ops_checks.backup_integrity_checks -v

      - name: Run complete backend suite with PostgreSQL and PDF tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee "$RUNNER_TEMP/backend-tests.log"
          if grep -Eq '^OK \(skipped=[1-9][0-9]*\)' "$RUNNER_TEMP/backend-tests.log"; then
            echo "Required backend tests were skipped." >&2
            exit 1
          fi

  flutter:
    name: Flutter 3.47.5 / analyze, test, web, Android debug
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify EnactMeet browser attachment and cleanup
        working-directory: .
        run: python3 tools/test_enactmeet_web_bridge.py --browser google-chrome

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze Flutter sources
        run: flutter analyze --no-pub

      - name: Verify recruitment guide and meeting creation
        run: flutter test --no-pub test/recruitment_team_guide_test.dart test/meetings_creation_test.dart

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build release web application
        run: >-
          flutter build web --release --no-pub
          --build-name=1.0.27 --build-number=30
          --dart-define=ENACTSPACE_API_URL=https://api-enactspace.kerunjombor.net

      - name: Package verified web release
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          web = pathlib.Path('build/web')
          archive = pathlib.Path('build/enactspace-web.tar.gz')
          with tarfile.open(archive, 'w:gz') as bundle:
              for path in sorted(web.rglob('*')):
                  if path.is_file():
                      bundle.add(path, arcname=path.relative_to(web))
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {
              'source_commit': os.environ['RELEASE_SOURCE_SHA'],
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'version': json.loads((web / 'version.json').read_text()),
              'main_sha256': digest(web / 'main.dart.js'),
              'archive_sha256': digest(archive),
          }
          pathlib.Path('build/enactspace-web-release.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest))
          PY

      - name: Preserve verified web release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enactspace-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/build/enactspace-web.tar.gz
            frontend/build/enactspace-web-release.json
          if-no-files-found: error
          retention-days: 3

      - name: Build unsigned Android debug APK
        env:
          ORG_GRADLE_PROJECT_enactspaceCiWithoutFirebase: "true"
        run: flutter build apk --debug --no-pub
