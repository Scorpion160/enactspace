name: Repository security

on:
  pull_request:
    branches:
      - main
      - feat/product-readiness-v1
  push:
    branches:
      - main
      - feat/product-readiness-v1
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-dependency-audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit backend requirements
        # PYSEC-2026-1325 has no fixed ecdsa release. python-jose brings it in,
        # while application configuration rejects every JWT algorithm except HS256.
        # Reassess this exception before changing ALGORITHM or python-jose.
        run: >-
          python -m pip_audit --strict --requirement backend/requirements.txt
          --ignore-vuln PYSEC-2026-1325

  repository-guards:
    name: Secret, environment, and action-reference guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject tracked secret and environment material
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [path for path in tracked if path]
          forbidden_suffixes = (".p8", ".p12", ".pem", ".key", ".jks", ".keystore")
          forbidden_names = {
              "android/key.properties",
              "google-services.json",
              "GoogleService-Info.plist",
          }
          failures = []
          for path in tracked:
              normalized = path.replace("\\", "/")
              lower = normalized.lower()
              if lower.endswith(forbidden_suffixes):
                  failures.append(normalized)
              if any(lower.endswith(name.lower()) for name in forbidden_names):
                  failures.append(normalized)
              basename = PurePosixPath(normalized).name.lower()
              if (basename == ".env" or basename.startswith(".env.")) and not basename.endswith(".example"):
                  failures.append(normalized)

          private_key = re.compile(
              rb"-----BEGIN (?:(?:RSA|EC|OPENSSH|DSA|ENCRYPTED) )?PRIVATE KEY-----"
          )
          for path in tracked:
              try:
                  if private_key.search(open(path, "rb").read()):
                      failures.append(f"private-key block in {path}")
              except (OSError, PermissionError):
                  pass

          if failures:
              raise SystemExit("Forbidden tracked material:\n" + "\n".join(sorted(set(failures))))
          PY

      - name: Require immutable external action references
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re

          immutable = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_./-]+)?@[0-9a-fA-F]{40}$")
          failures = []
          for workflow in pathlib.Path(".github/workflows").glob("*.y*ml"):
              for number, line in enumerate(workflow.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.match(r"^\s*(?:-\s*)?uses:\s*([^\s#]+)", line)
                  if not match:
                      continue
                  reference = match.group(1).strip("'\"")
                  if reference.startswith("./") or immutable.fullmatch(reference):
                      continue
                  failures.append(f"{workflow}:{number}: mutable action reference")
          if failures:
              raise SystemExit("\n".join(failures))
          PY
