services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: enactspace_pr2b_test
      POSTGRES_USER: pr2b_test
      POSTGRES_PASSWORD: ${PR2B_TEST_DB_PASSWORD:?Generate a disposable test password}
    ports:
      - "127.0.0.1:${PR2B_TEST_DB_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr2b_test -d enactspace_pr2b_test"]
      interval: 2s
      timeout: 3s
      retries: 20
